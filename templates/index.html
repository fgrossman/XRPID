
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>XRPCode Map and Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/leaflet.css" />
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .tab {
            overflow: hidden;
            background-color: #f1f1f1;
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .tab button {
            background-color: inherit;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 14px 16px;
            transition: 0.3s;
            font-size: 17px;
        }
        .tab button:hover {
            background-color: #ddd;
        }
        .tab button.active {
            background-color: #ccc;
        }
        .tabcontent {
            display: none;
            padding: 20px;
        }
        .tabcontent.active {
            display: block;
        }
        #map {
            width: 100%;
            height: 600px;
        }
        .dashboard {
            text-align: center;
            font-family: Arial, sans-serif;
        }
        .dashboard > div {
            display: inline-block;
            vertical-align: top;
            margin: 10px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background-color: #f9f9f9;
            width: 200px;
        }
        .dashboard > div h2 {
            margin: 0 0 10px 0;
        }
        .dashboard > div p {
            font-size: 24px;
            font-weight: bold;
            margin: 0;
        }
        .dashboard .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin: 4px 0 0 0;
            font-size: 16px;
        }
        .dashboard .stat-row strong {
            font-size: 24px;
            font-weight: bold;
        }
        .filters {
            text-align: center;
            margin-bottom: 20px;
        }
        .heat-pin.leaflet-div-icon {
            background: none;
            border: none;
        }
        .map-legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
            background: white;
            padding: 10px 14px;
            border-radius: 8px;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.3);
            font-size: 13px;
            line-height: 1.6;
        }
        .map-legend h4 {
            margin: 0 0 6px 0;
            font-size: 13px;
        }
        .map-legend .legend-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .map-legend .swatch {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 1px solid #333;
            display: inline-block;
        }
        #Map {
            position: relative;
        }
    </style>
</head>
<body>

<div class="tab">
    <button class="tablinks" onclick="openTab(event, 'Map')" id="defaultOpen">Map</button>
    <button class="tablinks" onclick="openTab(event, 'Dashboard')">Dashboard</button>
</div>

<div id="Map" class="tabcontent active">
    <div class="filters">
        <label for="startDate">Start Date:</label>
        <input type="date" id="startDate" />

        <label for="endDate">End Date:</label>
        <input type="date" id="endDate" />

        <button onclick="fetchData()">Apply</button>
    </div>
    <div id="map"></div>
    <div class="map-legend">
        <h4>Unique XRPs</h4>
        <div class="legend-row"><span class="swatch" style="background:#2b83ba"></span> 1</div>
        <div class="legend-row"><span class="swatch" style="background:#abdda4"></span> 2-5</div>
        <div class="legend-row"><span class="swatch" style="background:#fdae61"></span> 6-10</div>
        <div class="legend-row"><span class="swatch" style="background:#d7191c"></span> more than 10</div>
    </div>
</div>

<div id="Dashboard" class="tabcontent">
    <div class="dashboard" id="dashboard"></div>
</div>


<script>
    const today = new Date();
    const yesterday = new Date();
    yesterday.setDate(today.getDate() - 1);
    let lastStartDate = '';
    let lastEndDate = '';

    document.getElementById('startDate').value = yesterday.toISOString().split('T')[0];
    document.getElementById('endDate').value = today.toISOString().split('T')[0];

    function openTab(evt, tabName) {
        var i, tabcontent, tablinks;
        tabcontent = document.getElementsByClassName("tabcontent");
        for (i = 0; i < tabcontent.length; i++) {
            tabcontent[i].className = tabcontent[i].className.replace(" active", "");
        }
        tablinks = document.getElementsByClassName("tablinks");
        for (i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(" active", "");
        }
        document.getElementById(tabName).className += " active";
        evt.currentTarget.className += " active";
    }
    document.getElementById("defaultOpen").click();

    async function fetchData() {
        const startDate = document.getElementById('startDate').value;
        const endDate = document.getElementById('endDate').value;

        // Check if date range has changed
    if (startDate === lastStartDate && endDate === lastEndDate) {
        console.log('Date range unchanged — skipping fetch');
        return;
    }

    // Save new date range
    lastStartDate = startDate;
    lastEndDate = endDate;

        try {
            const response = await fetch(`/api/getData?start=${startDate}&end=${endDate}`);
            const result = await response.json();

            if (result.data) {
                resetMapAndDashboard();
                processData(result.data);  // Pass only the array part
            } else {
                console.error('Error fetching data:', result);
            }
        } catch (error) {
            console.error('Fetch error:', error);
        }
}

function resetMapAndDashboard() {
    // Remove old map instance if exists
    if (window.currentMap) {
        window.currentMap.remove();
    }

    // Create new blank map
    window.currentMap = L.map('map').setView([0, 0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(window.currentMap);

    // Clear dashboard content
    //document.getElementById('dashboard').innerHTML = '';
}

function getHeatColor(uniqueCount) {
    if (uniqueCount <= 1) return '#2b83ba';
    if (uniqueCount <= 5) return '#abdda4';
    if (uniqueCount <= 10) return '#fdae61';
    return '#d7191c';
}

function heatPinIcon(color) {
    return L.divIcon({
        className: 'heat-pin',
        html: `<svg xmlns="http://www.w3.org/2000/svg" width="25" height="41" viewBox="0 0 25 41">
            <path fill="${color}" stroke="#333" stroke-width="1" d="M12.5 0C5.6 0 0 5.6 0 12.5c0 8.8 12.5 28.5 12.5 28.5S25 21.3 25 12.5C25 5.6 19.4 0 12.5 0z"/>
            <circle cx="12.5" cy="12.5" r="4.5" fill="white" fill-opacity="0.9"/>
        </svg>`,
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [0, -34]
    });
}

function processData(data) {

    const map = window.currentMap;   
    //const map = L.map('map').setView([0, 0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const cityStats = {};
    const uniqueXRP = new Set();
    const xrpCodeV1 = new Set();
    const xrpCodeV2 = new Set();
    const xrpTypeBeta = new Set();
    const xrpTypeV1 = new Set();
    const xrpTypeNano = new Set();
    let totalXrps = 0, bluetoothCount = 0, macCount = 0, windowsCount = 0, chromebookCount = 0;

    data.forEach(row => {
        const xrpId = (row.xrp_id || row.XRPID || '').toString().trim();
        if (xrpId) {
            uniqueXRP.add(xrpId);
            if (row.platform === 'XRP-react') {
                xrpCodeV2.add(xrpId);
            } else if (row.platform === 'XRPCode') {
                xrpCodeV1.add(xrpId);
            }
            const xrpType = (row.xrp_type || row.XRPType || '').toString().trim().toLowerCase();
            if (xrpType === 'beta') {
                xrpTypeBeta.add(xrpId);
            } else if (xrpType === 'V1') {
                xrpTypeV1.add(xrpId);
            } else if (xrpType === 'nano') {
                xrpTypeNano.add(xrpId);
            }
        }

        if (!row.latitude || !row.longitude || !row.city || !row.state || !xrpId) return;

        const key = `${row.city},${row.state}`;
        if (!cityStats[key]) {
            cityStats[key] = {
                city: row.city,
                state: row.state,
                latitude: row.latitude,
                longitude: row.longitude,
                xrps: new Set(),
                totalXrps: 0,
                bluetooth: 0,
                mac: 0,
                windows: 0,
                chromebook: 0
            };
        }

        cityStats[key].xrps.add(xrpId);
        cityStats[key].totalXrps++;
        if (row.ble) cityStats[key].bluetooth++;
        if (row.user_agent && row.user_agent.includes("Macintosh")) cityStats[key].mac++;
        if (row.user_agent && row.user_agent.includes("Windows NT")) cityStats[key].windows++;
        if (row.user_agent && row.user_agent.includes("CrOS")) cityStats[key].chromebook++;

        totalXrps++;
        if (row.ble) bluetoothCount++;
        if (row.user_agent && row.user_agent.includes("Macintosh")) macCount++;
        if (row.user_agent && row.user_agent.includes("Windows NT")) windowsCount++;
        if (row.user_agent && row.user_agent.includes("CrOS")) chromebookCount++;
    });

    Object.values(cityStats).forEach(stat => {
        const popupContent = `
            <strong>${stat.city}, ${stat.state}</strong><br>
            Unique XRPs: ${stat.xrps.size}<br>
            Bluetooth: ${(stat.bluetooth / stat.totalXrps * 100).toFixed(0)}%<br>
            Mac Machines: ${stat.mac}<br>
            Windows Machines: ${stat.windows}<br>
            Chromebooks: ${stat.chromebook}
        `;
        L.marker([stat.latitude, stat.longitude], {
            icon: heatPinIcon(getHeatColor(stat.xrps.size))
        }).addTo(map)
            .bindPopup(popupContent);
    });

    const dashboard = document.getElementById("dashboard");
    dashboard.innerHTML = `
        <div><h2>🌍 Total Cities</h2><p>${Object.keys(cityStats).length}</p></div>
        <div><h2>🔗 Unique XRPs</h2><p>${uniqueXRP.size}</p></div>
        <div>
            <h2>📘 XRPCode</h2>
            <div class="stat-row"><span>V1</span><strong>${xrpCodeV1.size}</strong></div>
            <div class="stat-row"><span>V2</span><strong>${xrpCodeV2.size}</strong></div>
        </div>
        <div>
            <h2>🤖 XRP Type</h2>
            <div class="stat-row"><span>beta</span><strong>${xrpTypeBeta.size}</strong></div>
            <div class="stat-row"><span>V1</span><strong>${xrpTypeV1.size}</strong></div>
            <div class="stat-row"><span>nano</span><strong>${xrpTypeNano.size}</strong></div>
        </div>
        <div><h2>📶 Bluetooth Connections</h2><p>${((bluetoothCount / totalXrps) * 100).toFixed(0)}%</p></div>
        <div><h2>💻 Mac Machines</h2><p>${macCount}</p></div>
        <div><h2>🖥️ Windows Machines</h2><p>${windowsCount}</p></div>
        <div><h2>💼 Chromebooks</h2><p>${chromebookCount}</p></div>
    `;
}
</script>

</body>
</html>
